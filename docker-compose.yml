version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_tracker_db
    restart: always
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_secure_password
      POSTGRES_DB: job_tracker_database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
